  <meta charset="utf-8" />

  <title>Interpretador Halisense Soil Tester – Ferkhloe (v2.1)</title>

  <style>
    :root{
      --bg:#3b2a20;          /* Fondo café */
      --text:#efe7df;        /* Texto crema */
      --muted:#c9b8a9;       /* Texto secundario */
      --chip:#2e221b;        /* Pastillas */
      --card:#4a3529;        /* Tarjeta café */
      --border:#6b4e3d;      /* Borde estilo madera */
    }

    *{
      box-sizing:border-box;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial
    }

    html,body{
      margin:0;
      background:var(--bg);
      color:var(--text);
    }

    h2{
      margin:0;
    }

    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:0 16px 24px;
    }

    .grid{
      display:grid;
      grid-template-columns:1.05fr 1fr;
      gap:16px;
    }

    @media(max-width:980px){
      .grid{grid-template-columns:1fr}
      .header-brand{flex-direction:column;align-items:flex-start}
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:16px;
      box-shadow:0 10px 30px rgba(0,0,0,.45);
    }

    .card h3{
      margin:0;
      padding:12px 14px;
      border-bottom:1px solid var(--border);
      font-size:1.05rem;
    }

    .content{
      padding:12px 14px;
    }

    label{
      display:block;
      margin:.45rem 0 .15rem;
      color:var(--muted);
      font-size:.9rem;
    }

    select,input{
      width:100%;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid #7a5a46;
      background:#2e221b;
      color:var(--text);
    }

    input[type=number]{appearance:textfield}

    .row{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
    }

    .row3{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
    }

    .btns{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:8px;
    }

    button{
      cursor:pointer;
      border:none;
      border-radius:10px;
      padding:10px 14px;
      background:#d8a164;
      color:#2e221b;
      font-weight:700;
      box-shadow:0 4px 10px rgba(0,0,0,.35);
    }

    button.secondary{
      background:#2e221b;
      color:#f3e6d8;
      border:1px solid #8b6a52;
      box-shadow:none;
    }

    button:hover{
      filter:brightness(1.06);
    }

    .small{
      font-size:.8rem;
      color:var(--muted);
    }

    .kpis{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:8px;
    }

    .badge{
      background:#3a281e;
      border:1px solid #8b6a52;
      border-radius:999px;
      padding:8px 10px;
      font-size:.82rem;
    }

    .chips{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    .pill{
      padding:6px 10px;
      border-radius:999px;
      background:var(--chip);
      border:1px solid #7a5a46;
      font-size:.78rem;
    }

    .lvl-vb,
    .lvl-b{
      background:rgba(231,76,60,.22);
      border-color:rgba(231,76,60,.7);
    }

    .lvl-mb,
    .lvl-ma{
      background:rgba(243,156,18,.22);
      border-color:rgba(243,156,18,.7);
    }

    .lvl-m{
      background:rgba(46,204,113,.24);
      border-color:rgba(46,204,113,.7);
    }

    .lvl-a,
    .lvl-va{
      background:rgba(52,152,219,.22);
      border-color:rgba(52,152,219,.7);
    }

    .rec{
      white-space:pre-wrap;
      line-height:1.35;
    }

    .muted{
      color:var(--muted);
    }

    .header-brand{
      display:flex;
      align-items:center;
      gap:12px;
      padding:16px;
    }

    .header-brand img{
      height:48px;
      width:auto;
    }

    .denied{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      text-align:center;
      gap:8px;
      padding:24px;
    }

    .micro-box{
      margin-top:10px;
      padding:8px 10px;
      border-radius:10px;
      border:1px solid #8b6a52;
      background:#3a281e;
      font-size:.85rem;
    }

    .micro-title{
      font-weight:600;
      margin-bottom:4px;
      color:var(--muted);
    }
  </style>
</head>
<body>

  <noscript>

  <div class="header-brand">
    <img src="https://ferkhloe.webcindario.com/logo%20ferkhloe.png">
    <h2>Interpretador Halisense Soil Tester – Ferkhloe v2.1</h2>
  </div>

  <div class="wrap grid">
    <section class="card">
      <h3>Lecturas de campo</h3>
      <div class="content">
        <label>Cultivo
          <select id="crop">
            <option value="Cafe">Café</option>
            <option value="Platano">Plátano</option>
            <option value="Cacao">Cacao</option>
          </select>
        </label>
        <div class="row">
          <div>
            <label>Fase
              <select id="fase">
                <option value="Establecimiento">Establecimiento</option>
                <option value="Vegetativo">Vegetativo</option>
                <option value="Floracion/Induccion">Floración/Inducción</option>
                <option value="Fructificacion/Llenado">Fructificación/Llenado</option>
              </select>
            </label>
          </div>
          <div>
            <label>Temperatura (°C)
              <input id="t" type="number" placeholder="28">
            </label>
          </div>
        </div>

        <div class="row3" style="margin-top:6px">
          <div><label>pH <input id="pH" type="number" step="0.1"></label></div>
          <div><label>CE (µS/cm) <input id="ec" type="number"></label></div>
          <div><label>Humedad (%) <input id="hum" type="number" step="0.1"></label></div>
        </div>

        <div class="row3" style="margin-top:6px">
          <div><label>N (mg/kg) <input id="n" type="number"></label></div>
          <div><label>P (mg/kg) <input id="p" type="number"></label></div>
          <div><label>K (mg/kg) <input id="k" type="number"></label></div>
        </div>

        <div class="btns">
          <button id="evaluate">Evaluar</button>
          <button class="secondary" id="clear">Limpiar</button>
          <button class="secondary" id="export">Exportar CSV</button>
          <button class="secondary" id="print">Imprimir / PDF</button>
        </div>

        <!-- NUEVO: actividad microbiológica según pH -->
        <div class="micro-box">
          <div class="micro-title">Actividad microbiológica según pH</div>
          <div id="microinfo">Ingrese un valor de pH y presione “Evaluar” para interpretar la microbiología del suelo.</div>
        </div>

        <div class="small">Debug: <span id="debug"></span></div>
      </div>
    </section>

    <section class="card">
      <h3>Diagnóstico</h3>
      <div class="content">
        <div id="kpi" class="kpis"></div>
        <div style="margin:8px 0">
          <div class="muted">Semáforo por parámetro</div>
          <div id="chips" class="chips"></div>
        </div>
        <div class="muted" style="margin-top:8px">Recomendaciones Ferkhloe</div>
        <div id="rec" class="rec"></div>
      </div>
    </section>
  </div>

  <script>
  // === CONFIGURAR CLAVE AQUÍ ===
  const CORRECT_PASSWORD = "soil2435";

  function checkAccess(){
    const pass = prompt("Ingrese la clave de acceso:");
    if(pass === CORRECT_PASSWORD){
      return true;
    }
    document.body.innerHTML = `
      <div class="denied">
        <h2>Acceso denegado</h2>
        <p>La clave ingresada no es correcta.</p>
        <p>Vuelva a cargar la página para intentar nuevamente.</p>
      </div>
    `;
    return false;
  }

  // === Datos de cultivos: Café, Plátano, Cacao ===
  const CULTIVOS = {
    "Cafe": {
      pH:[5.2,6.5],
      EC:[80,600],
      HUM:[30,55],
      N:[15,90],
      P:[8,25],
      K:[40,150]
    },
    "Platano": {
      pH:[5.2,7.5],
      EC:[60,900],
      HUM:[30,55],
      N:[8,80],
      P:[9,35],
      K:[40,250]
    },
    "Cacao": {
      pH:[5,5.8],
      EC:[200,600],
      HUM:[35,55],
      N:[40,80],
      P:[15,25],
      K:[90,180]
    }
  };

  const FASES = {
    "Establecimiento":       {EC:0.6, N:0.8, P:1,   K:0.5},
    "Vegetativo":            {EC:0.8, N:1.3, P:1,   K:1},
    "Floracion/Induccion":   {EC:1,   N:0.8, P:1.15,K:1.1},
    "Fructificacion/Llenado":{EC:1.1, N:0.8, P:1,   K:1.2}
  };

  function $(id){return document.getElementById(id)}
  const dbg = t => { const el = $('debug'); if(el) el.textContent = t; };

  function adjust([a,b],f){
    return [Math.round(a*f),Math.round(b*f)];
  }

  function nivel(v,[a,b]){
    if(isNaN(v)) return {code:'',txt:'',cls:''};
    const d = b-a;
    const t = (v-a)/d;
    let code,cls,txt;

    if(t<-0.5){           code='VB'; cls='lvl-vb'; txt='Muy bajo'; }
    else if(t<0){         code='B';  cls='lvl-b';  txt='Bajo'; }
    else if(t<0.25){      code='MB'; cls='lvl-mb'; txt='Medio bajo'; }
    else if(t<=0.75){     code='M';  cls='lvl-m';  txt='Medio (óptimo)'; }
    else if(t<=1){        code='MA'; cls='lvl-ma'; txt='Medio alto'; }
    else if(t<=1.5){      code='A';  cls='lvl-a';  txt='Alto'; }
    else {                code='VA'; cls='lvl-va'; txt='Muy alto'; }

    return {code,cls,txt};
  }

  // NUEVO: interpretación microbiológica según pH
  function microFromPH(pH){
    if(isNaN(pH)){
      return "Ingrese un valor de pH para interpretar la actividad microbiológica.";
    }

    if(pH < 4.8){
      return "pH muy ácido (<4,8): actividad bacteriana y de actinomicetos muy limitada; predominan hongos acidófilos. Alto riesgo de toxicidad por Al y bloqueo de Ca–Mg–P.";
    } else if(pH < 5.3){
      return "pH ácido fuerte (4,8–5,2): dominan hongos y algunas micorrizas tolerantes. Nitrificación restringida y menor mineralización de residuos; conviene seguir corrigiendo acidez.";
    } else if(pH < 6.2){
      return "pH óptimo biológico (≈5,3–6,1): máxima diversidad de bacterias, actinomicetos, Trichoderma y micorrizas. Alta descomposición de materia orgánica y buena liberación de N–P–S. Es el rango ideal para café y cacao bajo modelo de agricultura tropical.";
    } else if(pH < 7.2){
      return "pH ligeramente ácido–neutro (6,2–7,1): buena mineralización, aunque se favorecen algunas bacterias oportunistas. En café y cacao se debe vigilar que no se pierda la condición de suelo de bosque (exceso de cales o carbonatos).";
    } else {
      return "pH alcalino (>7,2): cae la solubilidad de P, Fe, Mn y Zn; la microbiota se inclina a bacterias alcalófilas y disminuyen hongos y micorrizas de bosque. Conviene acidificar ligeramente y aportar materia orgánica fresca y coloidal.";
    }
  }

  function recomendaciones(key,lv){
    const L = lv.code;
    const rec = {};

    rec.pH = {
      low:'Subir pH: enmienda con Materia organica 3Ms 500 gr/planta; extracto de leonarditas 5 litros por 200 L, pH final 9; lechada al 50% + 2 L de leonarditas. Aplicación de cales agrícolas según análisis.',
      high:'Bajar pH: azufre elemental, ácidos orgánicos, ácido cítrico con leonarditas, aplicación de acetatos o microorganismos líquidos al 20%, evitar carbonatos y NH4⁺.'
    };
    rec.EC = {
      low:'CE baja: nutrición ligera y constante; bioles/supermagro al 10% al suelo + 1% de leonarditas + 1% de sal marina; activar microbiología con ácidos húmicos y fúlvicos.',
      high:'CE alta: lavar sales con riegos fraccionados o aplicación de humatos; evitar cloruros; usar fuentes ácidas tipo MM líquidos y añadir MO coloidal.'
    };
    rec.HUM = {
      low:'Humedad baja: mulch, MO estable, hidroretenedores (Biochar o 3Ms), riegos tempranos.',
      high:'Humedad alta: mejorar drenaje/descompactar, elevar porosidad y materia orgánica fibrosa.'
    };
    rec.N = {
      low:'N bajo: bioles/Biodesarrollo; supermagro; urea + humatos; fraccionar N mineral; té de Mo 3Ms; bacterias fijadoras de N. Vigilar S y Mo.',
      high:'N alto: reducir dosis, aumentar Ca/B/Si; riesgo de tejidos blandos y plagas chupadoras.'
    };
    rec.P = {
      low:'P bajo: fosfato natural activado + ácidos húmicos; fosforita; DAP + humatos; Humifos; micorrizas; mantener pH en rango.',
      high:'P alto: puede bloquear Zn/Fe; subir MO y quelatos; MM de montaña al 10% + diatomeas; suspender aplicaciones de P.',
    };
    rec.K = {
      low:'K bajo: sulfopotasico 2% + té de materia orgánica 20% / humatos K 5%; KCl 2% + extracto de leonarditas 5%; té de lombricompost 10% + sulfato de potasio 0,5%. Equilibrar con Ca-Mg.',
      high:'K alto: reduce Ca/Mg; moderar K y reforzar Ca/Mg/B.'
    };

    const dir = (L==='VB'||L==='B'||L==='MB') ? 'low'
               : (L==='MA'||L==='A'||L==='VA') ? 'high'
               : 'ok';

    if(dir==='ok') return 'En rango: mantener estrategia y monitoreo.';
    return rec[key] ? rec[key][dir] : '';
  }

  function evaluate(){
    try{
      const cult = CULTIVOS[$('crop').value];
      const fase = $('fase').value;
      const f    = FASES[fase];

      const R = {
        pH:  cult.pH,
        EC:  adjust(cult.EC,f.EC),
        HUM: cult.HUM,
        N:   adjust(cult.N,f.N),
        P:   adjust(cult.P,f.P),
        K:   adjust(cult.K,f.K)
      };

      const V = {
        pH:+$('pH').value,
        EC:+$('ec').value,
        HUM:+$('hum').value,
        N:+$('n').value,
        P:+$('p').value,
        K:+$('k').value,
        T:+$('t').value
      };

      const kpi = $('kpi');
      kpi.innerHTML='';
      [['Cultivo',$('crop').value],
       ['Fase',fase],
       ['Temp',isNaN(V.T)?'':V.T+' °C']].forEach(x=>{
        const d=document.createElement('div');
        d.className='badge';
        d.textContent=x[0]+': '+x[1];
        kpi.appendChild(d);
      });

      const chips=$('chips');
      chips.innerHTML='';
      const orden=['pH','EC','HUM','N','P','K'];
      orden.forEach(k=>{
        const lv=nivel(V[k],R[k]);
        if(!lv.code) return;
        const s=document.createElement('span');
        s.className='pill '+lv.cls;
        s.textContent=`${k}: ${lv.txt} (ideal ${R[k][0]}–${R[k][1]})`;
        chips.appendChild(s);
      });

      const rec=[];
      orden.forEach(k=>{
        const lv=nivel(V[k],R[k]);
        if(!lv.code) return;
        const txt=recomendaciones(k,lv);
        if(txt && lv.code!=='M') rec.push(`• ${k}: ${txt}`);
      });

      if(!isNaN(V.T)){
        if(V.T>32) rec.push('• Temperatura: >32 °C → estrés térmico; riegos tempranos, sombreo y mulch.');
        if(V.T<16) rec.push('• Temperatura: <16 °C → metabolismo lento; cuidado con sobrefertilizar.');
      }

      $('rec').textContent = rec.length
        ? rec.join('\n')
        : 'Todos los parámetros ingresados están en rango. Mantener manejo y seguimiento.';

      // Actualizar cuadro de microbiología según pH
      const microDiv = $('microinfo');
      if(microDiv){
        microDiv.textContent = microFromPH(V.pH);
      }

      dbg('ok');
    }catch(e){
      dbg('error: '+e.message);
    }
  }

  function clearAll(){
    ['pH','ec','hum','n','p','k','t'].forEach(id=>{$(id).value=''});
    $('kpi').innerHTML='';
    $('chips').innerHTML='';
    $('rec').textContent='';
    const microDiv = $('microinfo');
    if(microDiv){
      microDiv.textContent = 'Ingrese un valor de pH y presione “Evaluar” para interpretar la microbiología del suelo.';
    }
    dbg('clear');
  }

  function exportCSV(){
    const row = {
      fecha:  new Date().toISOString(),
      cultivo:$('crop').value,
      fase:   $('fase').value,
      pH:     $('pH').value,
      CE:     $('ec').value,
      Hum:    $('hum').value,
      N:      $('n').value,
      P:      $('p').value,
      K:      $('k').value,
      Temp:   $('t').value
    };
    const csv = Object.keys(row).join(',') + '\n' + Object.values(row).join(',');
    const a   = document.createElement('a');
    a.href    = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    a.download='lectura_halisense_ferkhloe.csv';
    a.click();
    dbg('csv');
  }

  function start(){
    $('evaluate').onclick=evaluate;
    $('clear').onclick=clearAll;
    $('export').onclick=exportCSV;
    $('print').onclick=()=>window.print();
    dbg('ready');
  }

  function init(){
    if(!checkAccess()) return;
    start();
  }

  if(document.readyState!=='loading') init();
  else document.addEventListener('DOMContentLoaded',init);
  </script>
